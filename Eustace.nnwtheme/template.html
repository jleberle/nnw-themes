<!-- Template Variables

title: The title of the article
preferred_link: The best link to associate with the article for linking out.

external_link_label: A localized label for the external link.
external_link_stripped: The external link minus the scheme. Useful for displaying the external link.
external_link: The external link of the article if there is one provided by the author.

feed_link_title: The name of the feed associated with this article.
feed_link: The URL of the feed associated with this article.
byline: HTML that combines all the authors and links to them if available.
avatar_src: The image source URL for the feed icon / avatar.
dateline_style: Either "articleDateline" or "articleDatelineTitle" depending on if the title was populated or not.

datetime_long: Long version of a combined publish date and time.
datetime_medium: Medium length version of a combined publish date and time.
datetime_short: Short version of a combined publish date and time.

date_long: Long version of the publish date.
date_medium: Medium version of the publish date.
date_short: Long version of the publish date.

time_long: Long version of the publish time.
time_medium: Medium version of the publish time.
time_short: Long version of the publish time.

text_size_class: The size class that the user has selected in Preferences for article text.
body: The body of the article.

-->

<script>
(function () {
    // Collapse any image that fails to load (e.g. an ad/tracker pixel blocked
    // by a DNS filter) instead of leaving the browser's broken-image glyph and
    // reserved space behind. Registered via capture since 'error' events on
    // <img> don't bubble; this only fires on a genuine load failure, so it
    // never touches an image that renders.
    document.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || el.tagName !== 'IMG') {
            return;
        }
        // Hide the whole figure only when this image was its only picture, so
        // a multi-image figure keeps the ones that did load.
        var figure = el.closest('figure');
        if (figure && figure.querySelectorAll('img').length === 1) {
            figure.style.display = 'none';
        } else {
            el.style.display = 'none';
        }
    }, true);

    // NetNewsWire substitutes an empty string for any link it doesn't have —
    // an article whose external link matches its preferred link (the common
    // case), or a feed with no home page — which leaves <a href="">: an
    // unlabeled, focusable link that reloads the article when activated.
    // Unwrap those back to plain text, then drop the external-link row
    // entirely if that left it with nothing to say.
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('a[href=""]').forEach(function (a) {
            a.replaceWith.apply(a, Array.prototype.slice.call(a.childNodes));
        });
        var external = document.querySelector('.externalLink');
        if (external && !external.textContent.trim()) {
            external.style.display = 'none';
        }
    });
})();
</script>

<!-- These themes show the feed name as type rather than as an icon, but the
     app's reloadArticleImage() dereferences #nnwImageIcon unguarded when a
     feed icon arrives after render. Keep the element (hidden) so that call
     doesn't throw. -->
<img id="nnwImageIcon" class="nnw-nozoom" hidden alt="" src="[[avatar_src]]">

<!-- The masthead block is centered like a New Yorker article opener:
     the feed name reads as the "department" rubric, the title is the
     headline, and the byline sits beneath it in small caps. The body
     then breaks left back to a normal reading column. -->
<header class="headerContainer">
	<div class="rubric"><a class="rubricLink" href="[[feed_link]]">[[feed_link_title]]</a></div>
</header>

<article>
<div class="articleTitle"><h1><a href="[[preferred_link]]">[[title]]</a></h1></div>
<div class="byline">[[byline]]</div>
<div class="[[dateline_style]]"><a href="[[preferred_link]]">[[datetime_medium]]</a></div>
<div id="bodyContainer" class="articleBody [[text_size_class]]">[[body]]</div>
<div class="externalLink">[[external_link_label]] <a href="[[external_link]]">[[external_link_stripped]]</a></div>
</article>
