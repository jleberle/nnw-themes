name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Verify the committed install zips in dist/ match the theme sources —
      # i.e. that ./build.sh was run and its output committed after any theme
      # edit. The check is content-level (extract and diff) rather than a
      # byte-compare of the zips, so it can't false-positive on zip metadata
      # differences between platforms. diff -r in both directions catches
      # stale content, missing or orphaned zips, and stray files in a zip.
      - name: dist is in sync with theme sources
        run: |
          mkdir /tmp/src /tmp/zips
          cp -R *.nnwtheme /tmp/src/
          for z in dist/*.zip; do unzip -q "$z" -d /tmp/zips; done
          diff -r /tmp/src /tmp/zips

      - name: Info.plist is well-formed XML
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --noout ./*.nnwtheme/Info.plist

      # Folio, Quiet, and Atrium share one template verbatim. They carry
      # separate copies (a .nnwtheme folder has to be self-contained), so
      # assert they haven't drifted — the image and empty-link repair script
      # lives in there and a one-sided edit would be silent.
      - name: shared template.html copies are identical
        run: |
          for t in Folio Atrium; do
            diff "Quiet.nnwtheme/template.html" "$t.nnwtheme/template.html"
          done

      - name: shellcheck build.sh
        run: shellcheck build.sh preview.sh
